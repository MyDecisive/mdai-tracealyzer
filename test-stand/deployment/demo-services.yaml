---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traced-service-env
  labels:
    app.kubernetes.io/part-of: test-stand-demo
data:
  DD_ENV: local
  DD_TRACE_AGENT_URL: http://datadog-agent:8126
  DD_TRACE_SAMPLE_RATE: "1.0"
  DD_TRACE_RATE_LIMIT: "1000000"
  DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED: "true"
  DD_VERSION: 1.0.0
  DEMO_LOG_VERBOSITY: modest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: test-stand-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/part-of: test-stand-demo
    spec:
      containers:
        - name: demo-svc
          image: test-stand-demo-svc:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: traced-service-env
          env:
            - name: DEMO_ROLE
              value: catalog
            - name: DD_SERVICE
              value: catalog-api
            - name: PORT
              value: "8080"
            - name: POSTGRES_DSN
              value: postgres://demo:demo@postgres:5432/demo
            - name: PAYMENTS_URL
              value: http://payments-api:8080
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: test-stand-demo
spec:
  selector:
    app.kubernetes.io/name: catalog-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
