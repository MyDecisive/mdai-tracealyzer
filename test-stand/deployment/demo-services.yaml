          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: traced-service-env
          env:
            - name: DEMO_ROLE
              value: payments
            - name: DD_SERVICE
              value: payments-api
            - name: PORT
              value: "8080"
            - name: GATEWAY_URL
              value: http://gateway-api:8080
          ports:
            - containerPort: 8080
              name: http
