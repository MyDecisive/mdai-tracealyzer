---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: test-stand-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent-__DEMO_NAMESPACE__
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: test-stand-demo
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/spec", "nodes/proxy", "nodes/stats", "nodes/metrics"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent-__DEMO_NAMESPACE__
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: test-stand-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent-__DEMO_NAMESPACE__
subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: __DEMO_NAMESPACE__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: test-stand-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: datadog-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datadog-agent
        app.kubernetes.io/part-of: test-stand-demo
    spec:
      serviceAccountName: datadog-agent
      containers:
        - name: agent
          image: gcr.io/datadoghq/agent:7
          imagePullPolicy: IfNotPresent
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __DATADOG_SECRET_NAME__
                  key: api-key
            - name: DD_SITE
              value: us5.datadoghq.com
            - name: DD_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DD_KUBERNETES_KUBELET_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_KUBELET_TLS_VERIFY
              value: "false"
            - name: DD_DD_URL
              value: __DATADOG_FORWARDER_URL__
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "true"
            - name: DD_APM_DD_URL
              value: __DATADOG_FORWARDER_URL__
            - name: DD_APM_MAX_TPS
              value: "1000000"
            - name: DD_APM_ERROR_TPS
              value: "1000000"
            - name: DD_APM_MAX_EPS
              value: "1000000"
            - name: DD_APM_DISABLE_RARE_SAMPLER
              value: "true"
            - name: DD_LOGS_ENABLED
              value: "true"
            - name: DD_LOGS_CONFIG_LOGS_DD_URL
              value: __DATADOG_FORWARDER_URL__
            - name: DD_LOGS_CONFIG_USE_HTTP
              value: "true"
            - name: DD_LOGS_CONFIG_FORCE_USE_HTTP
              value: "true"
            - name: DD_LOGS_CONFIG_USE_COMPRESSION
              value: "true"
            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: "true"
            # Global autodiscovery filter: restrict to the demo namespace at
            # *discovery* time so the file launcher never opens log files for
            # pods outside it. The logs-only INCLUDE/EXCLUDE variants run too
            # late — files are tailed first and lines filtered after, which
            # breaks down under high-volume sources (e.g. the OTel collector's
            # debug exporter feedback loop).
            - name: DD_CONTAINER_INCLUDE
              value: kube_namespace:^__DEMO_NAMESPACE__$
            - name: DD_CONTAINER_EXCLUDE_LOGS
              value: image:gcr.io/datadoghq/agent:*
            - name: DD_REMOTE_CONFIGURATION_ENABLED
              value: "false"
            - name: DD_INVENTORIES_ENABLED
              value: "false"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "false"
            - name: DD_ENABLE_PAYLOADS_EVENTS
              value: "false"
            - name: DD_ENABLE_PAYLOADS_SERIES
              value: "false"
            - name: DD_ENABLE_PAYLOADS_SERVICE_CHECKS
              value: "false"
            - name: DD_ENABLE_PAYLOADS_SKETCHES
              value: "false"
            - name: DD_CONTAINER_IMAGE_ENABLED
              value: "false"
            - name: DD_CONTAINER_EXCLUDE
              value: "image:gcr.io/datadoghq/agent:*"
            - name: DD_LEADER_ELECTION
              value: "false"
            - name: DD_CLUSTER_AGENT_ENABLED
              value: "false"
          ports:
            - containerPort: 8126
              name: apm
          readinessProbe:
            tcpSocket:
              port: 8126
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pointerdir
              mountPath: /opt/datadog-agent/run
            - name: logpodpath
              mountPath: /var/log/pods
              readOnly: true
            - name: logcontainerpath
              mountPath: /var/log/containers
              readOnly: true
      volumes:
        - name: pointerdir
          hostPath:
            path: /opt/datadog-agent/run
            type: DirectoryOrCreate
        - name: logpodpath
          hostPath:
            path: /var/log/pods
        - name: logcontainerpath
          hostPath:
            path: /var/log/containers
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-agent
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: test-stand-demo
spec:
  selector:
    app.kubernetes.io/name: datadog-agent
  ports:
    - name: apm
      port: 8126
      targetPort: 8126
